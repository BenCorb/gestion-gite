<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accès gestion</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-panel">
      <p class="eyebrow">Gestion privée</p>
      <h1>Accès admin</h1>
      <form id="login-form" class="form-grid">
        <label class="full-width">
          <span>Mot de passe</span>
          <input id="admin-password" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary-button full-width" type="submit">Entrer</button>
      </form>
    </main>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script>
      const elements = {
        form: document.getElementById("login-form"),
        password: document.getElementById("admin-password"),
        toast: document.getElementById("toast"),
      };

      let toastTimeoutId = null;
      function showLoginToast(message, isError = false) {
        elements.toast.textContent = message;
        elements.toast.style.background = isError ? "rgba(138, 78, 67, 0.96)" : "rgba(59, 51, 41, 0.95)";
        elements.toast.classList.add("visible");
        window.clearTimeout(toastTimeoutId);
        toastTimeoutId = window.setTimeout(() => {
          elements.toast.classList.remove("visible");
        }, 3200);
      }

      elements.form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: elements.password.value }),
        });
        const data = await response.json();
        if (!response.ok) {
          showLoginToast(data.error || "Accès refusé.", true);
          return;
        }
        window.location.replace("/gestion/app");
      });
    </script>
  </body>
</html>
